[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -p no:warnings
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security exploit tests
    adversarial: AI adversarial tests
    slow: Slow tests (network, LLM)
