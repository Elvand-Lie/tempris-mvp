services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tempris_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    network_mode: host
    env_file:
      - .env
    volumes:
      - ../backend/data:/app/data:rw
      - ../frontend:/frontend:ro
      - ../docs:/app/docs:rw
      - chroma_data:/app/data/chroma

  nginx:
    image: nginx:1.24-alpine
    container_name: tempris_nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx_ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  freellmapi:
    build:
      context: ../freellmapi
      dockerfile: Dockerfile
    container_name: tempris_llm
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../freellmapi/.env
    volumes:
      - freellm_data:/app/data

volumes:
  freellm_data:
  chroma_data:
