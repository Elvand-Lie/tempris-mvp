name: Tempris Unified CI/CD Pipeline

on:
  push:
    branches: [ main, master, vps-prod-complete ]
  pull_request:
    branches: [ main, master, vps-prod-complete ]

jobs:
  validate-and-scan:
    name: Build & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/freellmapi/package-lock.json

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/backend/requirements.txt ]; then pip install -r app/backend/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx passlib bcrypt PyJWT cryptography pip-audit

      - name: Compile Python Sources
        run: python -m compileall app/backend scripts

      - name: Run Unified Test Suite
        env:
          ENVIRONMENT: test
          ENABLE_DEMO_CREDENTIALS: "true"
        run: |
          export PYTHONPATH="app/backend"
          python -m pytest app/backend/tests -q -p no:xdist

      - name: Validate FreeLLMAPI
        working-directory: app/freellmapi
        run: |
          npm ci
          npm run build
          npm test
          npm audit

      - name: "SDLC-S01: Dependency Vulnerability Scanning"
        run: |
          python scripts/ci/scan_dependencies.py

      - name: "SDLC-S02: Secret Scanning"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "SDLC-S03: Generate SBOM (CycloneDX JSON)"
        run: |
          python scripts/ci/generate_sbom.py

      - name: "SDLC-S04: Provenance Signature Verification"
        env:
          PROVENANCE_SIGNING_KEY: ${{ secrets.PROVENANCE_SIGNING_KEY }}
        run: |
          python scripts/ci/sign_provenance.py

      - name: "SDLC-S05: AI-Assisted Release Gates"
        run: |
          python scripts/ci/ai_review_gate.py
