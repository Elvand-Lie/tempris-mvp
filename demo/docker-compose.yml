# WO-10 — Terra partner demo deployment (isolated from Tempris production).
# edge: 443 only, Caddy TLS. app: internal network, NO outbound route.
services:
  caddy:
    image: caddy:2
    ports: ["443:443", "80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge, app]
    depends_on: [web]
  web:
    build:
      context: ./frontend
    networks: [app]
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://demo:${DEMO_DB_PASSWORD}@db:5432/terra_demo
    networks: [app]
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD}
      POSTGRES_DB: terra_demo
    volumes: [pg:/var/lib/postgresql/data]
    networks: [app]

networks:
  edge: {}
  app:
    internal: true   # web/api/db have no outbound internet (scope pinned by network)
volumes:
  pg: {}
  caddy_data: {}
