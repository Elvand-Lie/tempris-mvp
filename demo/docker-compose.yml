# WO-10 — Terra partner demo deployment.
# CURRENT TOPOLOGY (approved temporary shared-VPS arrangement, 2026-10-10):
# TLS terminates on the EXISTING production nginx gateway (host network mode),
# which serves demo.tempris-singapore.com and proxies to this stack's edge on
# 127.0.0.1:8080. Nothing here publishes a public port. The api and db sit on
# a fully internal docker network (no outbound route); only the static-file
# edge attaches to the publishable network, and it holds no credentials.
#
# Privilege separation: the long-running API container NEVER receives the
# bootstrap (superuser) password. Its environment is an explicit allow-list
# (no env_file): DATABASE_URL uses the runtime application role (no superuser,
# no BYPASSRLS — row-level security applies to it). Schema/role setup runs in
# the one-shot `bootstrap` service, gated on a healthy database, and is the
# only place the admin credentials exist.
#
# Frontend: the `webdist` one-shot service builds the React app inside Docker
# (no local Node needed) and publishes it to the `dist` volume the edge serves.
#
# The original dedicated-VPS variant (Caddy terminating TLS on 443 itself,
# per kit/deploy/DEPLOY.md) remains valid: change the edge ports to 443:443 +
# 80:80 and restore the demo.tempris-singapore.com site block in Caddyfile.
services:
  edge:
    image: caddy:2-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dist:/srv/www:ro
    depends_on:
      api:
        condition: service_started
      webdist:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 48m
    oom_score_adj: 500
    networks: [edge, internal]

  webdist:
    build: ./frontend
    volumes: [dist:/out]
    restart: "no"
    mem_limit: 512m
    networks: [internal]

  bootstrap:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: terra-demo-api
    env_file: .env          # privileged one-shot: needs admin + app passwords
    environment:
      ADMIN_DATABASE_URL: postgresql://demo:${DEMO_DB_PASSWORD}@db:5432/terra_demo
    command: ["python", "-c", "from app.db import init_schema; init_schema()"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: terra-demo-api
    # Explicit runtime allow-list — deliberately NO env_file here, so the
    # bootstrap password (DEMO_DB_PASSWORD) never enters this container.
    environment:
      DATABASE_URL: postgresql://${DB_APP_ROLE:-terra_app}:${DB_APP_PASSWORD}@db:5432/terra_demo
      DEMO_PACK_SHA256: ${DEMO_PACK_SHA256}
      DEMO_INVITE_SECRET: ${DEMO_INVITE_SECRET}
      DEMO_ALLOWED_ORIGIN: ${DEMO_ALLOWED_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 160m
    oom_score_adj: 500
    networks: [internal]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD}
      POSTGRES_DB: terra_demo
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d terra_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 224m
    oom_score_adj: 500
    networks: [internal]

networks:
  edge: {}            # only the edge attaches here; only it is publishable
  internal:
    internal: true    # api/db: no outbound internet route at all

volumes:
  pg: {}
  dist: {}
