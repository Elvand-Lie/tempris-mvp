server {
    listen 80;
    server_name YOUR_SERVER_IP;

    # H-10: Hide Nginx version from Server header
    server_tokens off;

    # H-11: Block sensitive file paths (source maps, git, env, config files)
    location ~* /\.(git|env|svn|npmrc|DS_Store) {
        deny all;
        return 404;
    }
    location ~* \.(map)$ {
        deny all;
        return 404;
    }
    location ~* /(package\.json|package-lock\.json|yarn\.lock|composer\.(json|lock)|Gemfile\.lock|requirements\.txt|Pipfile\.lock|go\.sum|pom\.xml|build\.gradle) {
        deny all;
        return 404;
    }

    # H-12: Strip upstream proxy headers that leak infrastructure info
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # --- Rate Limiting Zones ---
    # Auth: 5 requests per minute per IP (burst 3)
    # API: 100 requests per minute per IP (burst 20)
    # Scanner: 10 requests per minute per IP (burst 2)

    # Auth endpoints — strict rate limiting for brute force protection
    location /api/auth/ {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Scanner endpoints — prevent scan abuse
    location /api/scanner/ {
        limit_req zone=scanner burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/api/scanner/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # General API endpoints — standard rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Static frontend — no rate limit needed
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
