version: '3.8'

services:
  db:
    image: postgres:16
    container_name: tempris_db
    environment:
      POSTGRES_USER: tempris_admin
      POSTGRES_PASSWORD: tempris_password
      POSTGRES_DB: tempris_wave1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tempris_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://tempris_admin:tempris_password@db:5432/tempris_wave1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tempris_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
